<script>

let selected = "NVDA";
let chartData = [];

// instant base prices (never depend on API to load UI)
function basePrice(symbol) {
  const map = {
    NVDA: 210,
    AMD: 150,
    TSLA: 420,
    AAPL: 190,
    MSFT: 400,
    PLTR: 25
  };
  return map[symbol] || 100;
}

// build chart immediately
function initChart(price) {
  chartData = [];

  for (let i = 0; i < 40; i++) {
    chartData.push(price + Math.random() * 10 - 5);
  }

  drawChart();
}

// SAFE chart renderer (never breaks)
function drawChart() {
  const canvas = document.getElementById("chart");

  if (!canvas) return;

  const ctx = canvas.getContext("2d");

  if (!chartData || chartData.length < 2) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  let max = Math.max(...chartData);
  let min = Math.min(...chartData);

  // avoid crash if flat line
  if (max === min) max += 1;

  ctx.strokeStyle = "#22c55e";
  ctx.beginPath();

  for (let i = 0; i < chartData.length; i++) {
    let x = (i / (chartData.length - 1)) * canvas.width;
    let y = canvas.height - ((chartData[i] - min) / (max - min)) * canvas.height;

    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }

  ctx.stroke();
}

// UI render (sync only)
function render(symbol, price) {
  document.getElementById("stockName").innerText = symbol;
  document.getElementById("price").innerText = "$" + price.toFixed(2);

  initChart(price);

  document.querySelectorAll(".stock").forEach(el => {
    el.classList.remove("active");
    if (el.innerText === symbol) el.classList.add("active");
  });
}

// click handler (NO async, NO blocking)
function selectStock(symbol) {
  selected = symbol;

  const price = basePrice(symbol);
  render(symbol, price);
}

// fake live movement (always works)
setInterval(() => {
  if (!chartData.length) return;

  let last = chartData[chartData.length - 1];
  let next = last + (Math.random() - 0.5) * 3;

  chartData.push(next);
  chartData.shift();

  drawChart();

  document.getElementById("price").innerText =
    "$" + next.toFixed(2);
}, 1000);

// initial load (guaranteed)
window.onload = () => {
  selectStock("NVDA");
};

</script>
