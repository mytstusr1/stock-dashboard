<script>

let selected = "NVDA";
let chartData = [];

// instant fallback (ALWAYS used first)
function basePrice(symbol) {
  const map = {
    NVDA: 210,
    AMD: 150,
    TSLA: 420,
    AAPL: 190,
    MSFT: 400,
    PLTR: 25
  };
  return map[symbol] || 100;
}

// safe API fetch (non-blocking)
async function fetchPrice(symbol) {
  try {
    const res = await fetch(
      `https://query1.finance.yahoo.com/v7/finance/quote?symbols=${symbol}`
    );
    const data = await res.json();

    return data?.quoteResponse?.result?.[0]?.regularMarketPrice
      ?? basePrice(symbol);

  } catch (e) {
    return basePrice(symbol);
  }
}

// ALWAYS initialize chart instantly
function initChart(price) {
  chartData = [];

  for (let i = 0; i < 40; i++) {
    chartData.push(price + (Math.random() - 0.5) * 6);
  }

  drawChart();
}

// safe chart render (no empty crash)
function drawChart() {
  const canvas = document.getElementById("chart");
  const ctx = canvas.getContext("2d");

  if (!chartData.length) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  let max = Math.max(...chartData);
  let min = Math.min(...chartData);

  if (max === min) return;

  ctx.strokeStyle = "#22c55e";
  ctx.beginPath();

  chartData.forEach((p, i) => {
    let x = (i / chartData.length) * canvas.width;
    let y = canvas.height - ((p - min) / (max - min)) * canvas.height;

    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });

  ctx.stroke();
}

// instant UI render (NO waiting)
function renderStock(symbol, price) {
  document.getElementById("stockName").innerText = symbol;
  document.getElementById("price").innerText = "$" + price.toFixed(2);

  initChart(price);

  document.querySelectorAll(".stock").forEach(el => {
    el.classList.remove("active");
    if (el.innerText === symbol) el.classList.add("active");
  });
}

// CLICK HANDLER (fast UI first, real data later)
function selectStock(symbol) {
  selected = symbol;

  const fallback = basePrice(symbol);

  // STEP 1: instant render (NO loading)
  renderStock(symbol, fallback);

  // STEP 2: async real price update
  fetchPrice(symbol).then(price => {
    renderStock(symbol, price);
  });
}

// LIVE UPDATE LOOP (smooth simulation + refresh real price)
setInterval(() => {
  fetchPrice(selected).then(price => {
    chartData.push(price);
    chartData.shift();
    drawChart();

    document.getElementById("price").innerText =
      "$" + price.toFixed(2);
  });
}, 7000);

// INITIAL LOAD (instant, no API wait)
selectStock("NVDA");

</script>
