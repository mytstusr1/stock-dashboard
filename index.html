<script>

let selected = "NVDA";
let chartData = [];

// SAFE fallback price generator (prevents load freeze)
function fallbackPrice(symbol) {
  const base = {
    NVDA: 210,
    AMD: 150,
    TSLA: 420,
    AAPL: 190,
    MSFT: 400,
    PLTR: 25
  };
  return base[symbol] || 100;
}

// FIXED fetch with timeout + safe parsing
async function fetchPrice(symbol) {
  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 2500);

    const res = await fetch(
      `https://query1.finance.yahoo.com/v7/finance/quote?symbols=${symbol}`,
      { signal: controller.signal }
    );

    clearTimeout(timeout);

    const data = await res.json();
    return data?.quoteResponse?.result?.[0]?.regularMarketPrice
      ?? fallbackPrice(symbol);

  } catch (e) {
    return fallbackPrice(symbol);
  }
}

// build chart instantly (NO waiting)
function initChart(price) {
  chartData = [];

  for (let i = 0; i < 40; i++) {
    chartData.push(price + (Math.random() - 0.5) * 8);
  }
}

// safe chart drawing (no crash)
function drawChart() {
  const canvas = document.getElementById("chart");
  const ctx = canvas.getContext("2d");

  if (!chartData || chartData.length === 0) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  let max = Math.max(...chartData);
  let min = Math.min(...chartData);

  if (max === min) return;

  ctx.strokeStyle = "#22c55e";
  ctx.beginPath();

  chartData.forEach((p, i) => {
    let x = (i / chartData.length) * canvas.width;
    let y = canvas.height - ((p - min) / (max - min)) * canvas.height;

    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });

  ctx.stroke();
}

// FAST UI update (non-blocking)
function updateUI(symbol, price) {
  document.getElementById("stockName").innerText = symbol;
  document.getElementById("price").innerText = "$" + price.toFixed(2);

  initChart(price);
  drawChart();

  document.querySelectorAll(".stock").forEach(el => {
    el.classList.remove("active");
    if (el.innerText === symbol) el.classList.add("active");
  });
}

// NON-BLOCKING stock select
function selectStock(symbol) {
  selected = symbol;

  // instant UI with fallback (no loading delay)
  const base = fallbackPrice(symbol);
  updateUI(symbol, base);

  // async real price update in background
  fetchPrice(symbol).then(price => {
    updateUI(symbol, price);
  });
}

// real-time loop (lightweight)
setInterval(() => {
  fetchPrice(selected).then(price => {
    chartData.push(price);
    chartData.shift();
    drawChart();

    document.getElementById("price").innerText =
      "$" + price.toFixed(2);
  });
}, 6000);

// initial load (instant)
selectStock("NVDA");

</script>
