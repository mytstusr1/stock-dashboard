<script>

window.onload = function () {

  const canvas = document.getElementById("chart");
  const ctx = canvas.getContext("2d");

  let chartData = [];

  function basePrice(symbol) {
    const map = {
      NVDA: 210,
      AMD: 150,
      TSLA: 420,
      AAPL: 190,
      MSFT: 400,
      PLTR: 25
    };
    return map[symbol] || 100;
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (chartData.length < 2) return;

    let max = Math.max(...chartData);
    let min = Math.min(...chartData);

    if (max === min) max += 1;

    ctx.strokeStyle = "#22c55e";
    ctx.beginPath();

    chartData.forEach((p, i) => {
      let x = (i / (chartData.length - 1)) * canvas.width;
      let y = canvas.height - ((p - min) / (max - min)) * canvas.height;

      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });

    ctx.stroke();
  }

  function load(symbol) {
    document.getElementById("stockName").innerText = symbol;

    let price = basePrice(symbol);

    chartData = [];

    for (let i = 0; i < 40; i++) {
      chartData.push(price + Math.random() * 8 - 4);
    }

    draw();
  }

  window.selectStock = function(symbol) {
    load(symbol);
  }

  // initial render
  load("NVDA");

  // live movement
  setInterval(() => {
    if (!chartData.length) return;

    let last = chartData[chartData.length - 1];
    let next = last + (Math.random() - 0.5) * 2;

    chartData.push(next);
    chartData.shift();

    document.getElementById("price").innerText = "$" + next.toFixed(2);
    draw();

  }, 1000);

};

</script>
